services:
  webrtc-interop-mqtt:
    image: eclipse-mosquitto:2
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        cat > /tmp/mosquitto.conf <<'MOSQ'
        allow_anonymous true
        listener 9001 0.0.0.0
        protocol websockets
        MOSQ
        exec mosquitto -c /tmp/mosquitto.conf
    ports:
      - "127.0.0.1:9001:9001"
  webrtc-interop-turn:
    image: coturn/coturn:4.6
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        cat > /tmp/turnserver.conf <<'TURN'
        listening-port=3478
        fingerprint
        lt-cred-mech
        user=interop:interop
        realm=aurora-interop.test
        allow-loopback-peers
        cli-ip=127.0.0.1
        cli-password=interop-cli
        no-tls
        no-dtls
        verbose
        TURN
        exec turnserver -c /tmp/turnserver.conf
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
