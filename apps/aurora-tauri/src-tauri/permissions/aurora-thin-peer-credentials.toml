[[permission]]
identifier = "aurora-thin-peer-credentials"
description = "Allow thin WebView runtimes to store/delete/status opaque peer reconnect credentials, request challenge-bound reconnect proofs without returning raw bearer tokens, and store/retrieve the separately scoped room secret required to rebuild an approved WebRTC session."
commands.allow = [
  "aurora_thin_peer_credential_set",
  "aurora_thin_peer_credential_status",
  "aurora_thin_peer_credential_delete",
  "aurora_thin_peer_reconnect_prove",
  "aurora_thin_room_secret_set",
  "aurora_thin_room_secret_get",
  "aurora_thin_room_secret_delete",
  "aurora_remote_origin_policy"
]
