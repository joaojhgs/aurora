[[permission]]
identifier = "aurora-thin-peer-credentials"
description = "Allow desktop-thin WebView runtime to store/delete/status peer reconnect credentials and request challenge-bound reconnect proofs through the platform keychain. Raw bearer tokens are never returned to the WebView."
commands.allow = [
  "aurora_thin_peer_credential_set",
  "aurora_thin_peer_credential_status",
  "aurora_thin_peer_credential_delete",
  "aurora_thin_peer_reconnect_prove",
  "aurora_remote_origin_policy"
]
