name: Tauri Android Verification

on:
  workflow_call:
    inputs:
      release_version:
        description: "SemVer embedded in unsigned release artifacts"
        required: false
        default: ""
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/aurora-tauri/**"
      - "app/messaging/mesh_bus.py"
      - "app/services/auth/**"
      - "app/services/config/**"
      - "app/services/db/**"
      - "app/services/gateway/service.py"
      - "app/services/gateway/mesh/**"
      - "app/services/gateway/webrtc/**"
      - "app/services/gateway/utils/crypto.py"
      - "app/services/tooling/**"
      - "app/shared/auth/**"
      - "app/shared/config/**"
      - "app/shared/contracts/**"
      - "packages/aurora-sdk/**"
      - "packages/aurora-mesh-authority-web/**"
      - "packages/aurora-ui/**"
      - "packages/aurora-voice-web/**"
      - "rust/crates/**"
      - "tools/voice-runtime/**"
      - "tests/e2e/webrtc_interop/**"
      - "scripts/webrtc_interop_gateway.py"
      - "scripts/webrtc_interop_scan.py"
      - "scripts/webrtc_interop_services.sh"
      - "docker-compose.webrtc-interop.yml"
      - "package.json"
      - "pyproject.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "uv.lock"
      - ".github/workflows/tauri-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tauri:
    name: Android client APK/AAB build and emulator smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python interop peer
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"

      - name: Install uv for the external Python peer
        uses: astral-sh/setup-uv@v5

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android build components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "emulator" \
            "system-images;android-30;default;x86_64" \
            "system-images;android-35;google_apis;x86_64"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,wasm32-unknown-unknown

      - name: Install pinned browser voice toolchain
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126
          fallback: none

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply release artifact version
        if: inputs.release_version != ''
        run: node scripts/set_tauri_release_version.mjs "${{ inputs.release_version }}"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python WebRTC peer dependencies
        run: uv sync --extra sidecar-thin

      - name: Build shared UI packages
        run: |
          pnpm --filter @aurora/mesh-authority-web build
          pnpm --filter @aurora/client build
          pnpm --filter @aurora/ui build

      - name: Test Tauri runtime wrapper and Android client proof
        run: |
          pnpm --filter @aurora/tauri-ui test
          pnpm --filter @aurora/tauri-ui test:android-client-bundle

      - name: Initialize Tauri Android project
        run: pnpm --filter @aurora/tauri-ui android:init

      - name: Run Android preflight
        env:
          AURORA_ANDROID_PREFLIGHT_REPORT: reports/android-preflight.json
        run: pnpm --filter @aurora/tauri-ui android:preflight:ci

      - name: Upload Android preflight report
        uses: actions/upload-artifact@v4
        with:
          name: aurora-android-preflight
          path: apps/aurora-tauri/reports/android-preflight.json
          if-no-files-found: error

      - name: Build patched Android native speech runtime
        env:
          AURORA_BUILD_JOBS: "2"
          AURORA_SHERPA_ANDROID_ARTIFACT_ROOT: ${{ runner.temp }}/aurora-sherpa-android
        run: tools/voice-runtime/build_sherpa_android.sh

      - name: Export Android native speech runtime paths
        run: |
          echo "AURORA_SHERPA_ONNX_ANDROID_ARM64_V8A_LIB_DIR=${{ runner.temp }}/aurora-sherpa-android/runtime/arm64-v8a" >> "$GITHUB_ENV"
          echo "AURORA_SHERPA_ONNX_ANDROID_X86_64_LIB_DIR=${{ runner.temp }}/aurora-sherpa-android/runtime/x86_64" >> "$GITHUB_ENV"

      - name: Build Android client x86_64 debug APK
        if: inputs.release_version == ''
        run: pnpm --filter @aurora/tauri-ui android:build:client:apk:x86_64

      - name: Build Android client universal debug APK for release
        if: inputs.release_version != ''
        run: pnpm --filter @aurora/tauri-ui android:build:client:apk

      - name: Verify Android client debug APK contents
        run: pnpm --filter @aurora/tauri-ui android:verify:client:apk

      - name: Upload Android client APK proof
        uses: actions/upload-artifact@v4
        with:
          name: aurora-android-client-apk-proof
          path: apps/aurora-tauri/reports/android-client-apk-artifact-proof.json
          if-no-files-found: error

      - name: Upload Android client debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-android-client-debug-apk
          path: apps/aurora-tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Retain Android client smoke APK
        run: |
          mkdir -p apps/aurora-tauri/reports
          APK_OUTPUT_ROOT=apps/aurora-tauri/src-tauri/gen/android/app/build/outputs/apk
          # Tauri 2.11.3 emits the x86_64-targeted APK in either of these
          # generated debug layouts. Require one unambiguous build product.
          mapfile -t SMOKE_APKS < <(
            find "$APK_OUTPUT_ROOT" -type f \
              \( -path '*/x86_64/debug/*.apk' -o -path '*/universal/debug/*.apk' \) \
              -print | sort
          )
          if [ "${#SMOKE_APKS[@]}" -ne 1 ]; then
            printf 'Expected exactly one Android smoke APK; found %s\n' "${#SMOKE_APKS[@]}" >&2
            printf '%s\n' "${SMOKE_APKS[@]}" >&2
            exit 1
          fi
          cp "${SMOKE_APKS[0]}" apps/aurora-tauri/reports/android-client-smoke.apk

      - name: Build Android client debug AAB
        run: pnpm --filter @aurora/tauri-ui android:build:client:aab

      - name: Verify Android client debug AAB contents
        run: pnpm --filter @aurora/tauri-ui android:verify:client:aab

      - name: Upload Android client AAB proof
        uses: actions/upload-artifact@v4
        with:
          name: aurora-android-client-aab-proof
          path: apps/aurora-tauri/reports/android-client-aab-artifact-proof.json
          if-no-files-found: error

      - name: Upload Android client debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: aurora-android-client-debug-aab
          path: apps/aurora-tauri/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Android 11 baseline WebView and native payload E2E
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AURORA_ANDROID_APK: ${{ github.workspace }}/apps/aurora-tauri/reports/android-client-smoke.apk
          AURORA_ANDROID_TEST_TIMEOUT_MS: "900000"
        with:
          api-level: 30
          target: default
          arch: x86_64
          emulator-boot-timeout: 1200
          script: pnpm --filter @aurora/tauri-ui android:smoke

      - name: Android 15 current WebView, mobile browser, native payload, and Python peer WebRTC E2E
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AURORA_ANDROID_APK: ${{ github.workspace }}/apps/aurora-tauri/reports/android-client-smoke.apk
          AURORA_ANDROID_TEST_TIMEOUT_MS: "900000"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 1200
          script: |
            pnpm --filter @aurora/tauri-ui android:smoke
            AURORA_ANDROID_MOBILE_WEBRTC_LANE=turn pnpm --filter @aurora/tauri-ui android:webrtc:interop

      - name: Upload Android to Python WebRTC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-android-python-webrtc-interop
          path: apps/aurora-tauri/reports/webrtc-interop/
          if-no-files-found: warn
