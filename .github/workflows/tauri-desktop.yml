name: Tauri Desktop Verification

on:
  pull_request:
    paths:
      - "apps/aurora-tauri/**"
      - "app/services/auth/**"
      - "app/services/gateway/**"
      - "packages/aurora-sdk/**"
      - "packages/aurora-ui/**"
      - "scripts/desktop_live_*.sh"
      - "scripts/webrtc_interop*"
      - "tests/e2e/desktop_live/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/tauri-desktop.yml"
  workflow_dispatch:

jobs:
  linux-tauri:
    name: Desktop Tauri bundle (${{ matrix.bundle_mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle_mode: desktop-local
            upload_suffix: local
            needs_python: true
            smoke_local: true
          - bundle_mode: desktop-client
            upload_suffix: client
            needs_python: false
            smoke_local: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            portaudio19-dev \
            xvfb

      - name: Install desktop-local Python prerequisites
        if: matrix.needs_python
        run: sudo apt-get install -y python3-dev

      - name: Set up Python
        if: matrix.needs_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: matrix.needs_python
        uses: astral-sh/setup-uv@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri workspace dependencies
        run: |
          pnpm --filter @aurora/client build
          pnpm --filter @aurora/ui build

      - name: Build Tauri frontend bundle
        run: pnpm --filter @aurora/tauri-ui build

      - name: Test Tauri frontend runtime wrapper
        run: pnpm --filter @aurora/tauri-ui test

      - name: Prepare Python-free desktop client overlay
        if: matrix.bundle_mode == 'desktop-client'
        run: |
          pnpm --filter @aurora/tauri-ui prepare:bundle:desktop-client
          pnpm --filter @aurora/tauri-ui verify:bundle:desktop-client -- --allow-missing-bundle

      - name: Upload desktop client prepare proof
        if: matrix.bundle_mode == 'desktop-client'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-client-prepare-proof
          path: |
            apps/aurora-tauri/reports/desktop-client-bundle-prepare.json
            apps/aurora-tauri/reports/desktop-client-bundle-proof.json
          if-no-files-found: error

      - name: Prepare bundled desktop sidecar automatically
        if: matrix.bundle_mode == 'desktop-local'
        run: pnpm --filter @aurora/tauri-ui prepare:sidecar:desktop-local-minimal

      - name: Upload sidecar prepare report
        if: matrix.bundle_mode == 'desktop-local'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-sidecar-prepare-report-desktop-local-minimal
          path: apps/aurora-tauri/reports/sidecar-prepare.json
          if-no-files-found: error

      - name: Smoke packaged desktop sidecar runtime
        if: matrix.bundle_mode == 'desktop-local'
        run: pnpm --filter @aurora/tauri-ui sidecar:runtime:smoke

      - name: Upload packaged sidecar runtime smoke report
        if: always() && matrix.bundle_mode == 'desktop-local'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-sidecar-runtime-smoke
          path: apps/aurora-tauri/reports/sidecar-runtime-smoke.json
          if-no-files-found: error

      - name: Check Tauri Rust package
        run: cargo check
        working-directory: apps/aurora-tauri/src-tauri

      - name: Build Linux Tauri bundle
        run: pnpm --filter @aurora/tauri-ui build:bundle:${{ matrix.bundle_mode }}

      - name: Verify Python-free desktop client artifact contents
        if: matrix.bundle_mode == 'desktop-client'
        run: pnpm --filter @aurora/tauri-ui verify:bundle:desktop-client

      - name: Upload desktop client artifact proof
        if: matrix.bundle_mode == 'desktop-client'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-client-artifact-proof
          path: apps/aurora-tauri/reports/desktop-client-bundle-proof.json
          if-no-files-found: error

      - name: Smoke launch Tauri shell
        if: matrix.smoke_local
        env:
          AURORA_TAURI_DEV_SMOKE_TIMEOUT_MS: "360000"
        run: xvfb-run -a pnpm --filter @aurora/tauri-ui dev:smoke

      - name: Upload Tauri dev smoke report
        if: always() && matrix.smoke_local
        uses: actions/upload-artifact@v4
        with:
          name: tauri-dev-smoke-report
          path: apps/aurora-tauri/reports/tauri-dev-smoke.json

      - name: Smoke Tauri EventStream bridge
        if: matrix.smoke_local
        run: xvfb-run -a pnpm --filter @aurora/tauri-ui eventstream:smoke

      - name: Upload EventStream smoke report
        if: always() && matrix.smoke_local
        uses: actions/upload-artifact@v4
        with:
          name: tauri-eventstream-smoke-report
          path: apps/aurora-tauri/reports/eventstream-smoke.json
          if-no-files-found: warn

  desktop-client-live:
    name: Desktop client live Python-peer E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri WebDriver and audio prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            portaudio19-dev \
            python3-dev \
            xvfb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Python and workspace dependencies
        run: |
          uv sync --extra gateway
          pnpm install --frozen-lockfile

      - name: Build desktop client workspace dependencies
        run: |
          pnpm --filter @aurora/client build
          pnpm --filter @aurora/ui build

      - name: Install the official Tauri WebDriver bridge
        run: cargo install tauri-driver --locked

      - name: Run the Python-free desktop client against the real Python peer
        run: pnpm test:desktop-client:live

      - name: Upload desktop live E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-client-live-e2e
          path: reports/desktop-live-e2e/
          if-no-files-found: warn

  desktop-client-native-packages:
    name: Desktop client package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            artifact_suffix: macos
          - platform: Windows
            os: windows-latest
            artifact_suffix: windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri workspace dependencies
        run: |
          pnpm --filter @aurora/client build
          pnpm --filter @aurora/ui build

      - name: Verify native package policy and frontend types
        run: |
          pnpm --filter @aurora/tauri-ui test:ci-native-evidence
          pnpm --filter @aurora/tauri-ui typecheck

      - name: Check platform Rust package
        run: cargo check
        working-directory: apps/aurora-tauri/src-tauri

      - name: Build Python-free desktop client package
        run: pnpm --filter @aurora/tauri-ui build:bundle:desktop-client

      - name: Upload desktop client package
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-client-${{ matrix.artifact_suffix }}
          path: apps/aurora-tauri/src-tauri/target/release/bundle/**
          if-no-files-found: error

  sidecar-profile-matrix:
    name: Sidecar profile staging (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - desktop-local-minimal
          - local-cpu
          - local-cuda
          - local-rocm
          - local-metal
          - local-vulkan
          - local-sycl
          - local-rpc
          - full

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Create fake profile sidecar executable
        run: |
          mkdir -p /tmp/aurora-sidecar-${{ matrix.profile }}
          printf '#!/bin/sh\necho aurora sidecar profile %s\n' '${{ matrix.profile }}' > /tmp/aurora-sidecar-${{ matrix.profile }}/aurora-sidecar
          chmod +x /tmp/aurora-sidecar-${{ matrix.profile }}/aurora-sidecar

      - name: Stage sidecar profile
        env:
          AURORA_TAURI_SIDECAR_BUILD_OUTPUT: /tmp/aurora-sidecar-${{ matrix.profile }}/aurora-sidecar
        run: pnpm --filter @aurora/tauri-ui prepare:sidecar:${{ matrix.profile }}

      - name: Verify sidecar profile report
        run: |
          jq -e '.sidecarProfile == "${{ matrix.profile }}"' apps/aurora-tauri/reports/sidecar-prepare.json
          jq -e '.sourceKind == "existing-build-output"' apps/aurora-tauri/reports/sidecar-prepare.json
          jq -e '.secretsRedacted == true' apps/aurora-tauri/reports/sidecar-prepare.json

      - name: Upload sidecar profile report
        uses: actions/upload-artifact@v4
        with:
          name: tauri-sidecar-prepare-report-${{ matrix.profile }}
          path: apps/aurora-tauri/reports/sidecar-prepare.json
          if-no-files-found: error
