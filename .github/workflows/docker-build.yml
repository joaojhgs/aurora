name: Docker Images

on:
  workflow_call:
    inputs:
      publish_images:
        description: "Publish versioned images after the canonical release is created"
        required: false
        default: false
        type: boolean
      release_version:
        description: "Exact canonical release version used for every image tag"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "app/**"
      - "docker/**"
      - "docker-compose.process.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest PR commit; non-PR events use a unique run-id fallback.
concurrency:
  group: docker-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_NAMESPACE: ${{ github.repository_owner }}

jobs:
  compose-config:
    name: Validate process-mode Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate docker-compose.process.yml
        run: docker compose -f docker-compose.process.yml config --quiet

  docker-build:
    name: Validate ${{ matrix.service }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: compose-config
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            variant: latest
            dockerfile: docker/services/Dockerfile.auth
            build_args: ""
          - service: config
            variant: latest
            dockerfile: docker/services/Dockerfile.config
            build_args: ""
          - service: db
            variant: openai
            dockerfile: docker/services/Dockerfile.db
            build_args: DB_EMBEDDINGS_MODE=openai
          - service: db
            variant: local-cpu
            dockerfile: docker/services/Dockerfile.db
            build_args: DB_EMBEDDINGS_MODE=local
          - service: gateway
            variant: latest
            dockerfile: docker/services/Dockerfile.gateway
            build_args: ""
          - service: orchestrator
            variant: openai
            dockerfile: docker/services/Dockerfile.orchestrator
            build_args: ORCHESTRATOR_LLM_MODE=openai
          - service: orchestrator
            variant: llama-cpp-cpu
            dockerfile: docker/services/Dockerfile.orchestrator
            build_args: |
              ORCHESTRATOR_LLM_MODE=llama-cpp
              ORCHESTRATOR_HARDWARE=cpu
          - service: scheduler
            variant: latest
            dockerfile: docker/services/Dockerfile.scheduler
            build_args: ""
          - service: tooling
            variant: latest
            dockerfile: docker/services/Dockerfile.tooling
            build_args: ""
          - service: tts
            variant: cpu
            dockerfile: docker/services/Dockerfile.tts
            build_args: TTS_HARDWARE=cpu
          - service: stt-coordinator
            variant: latest
            dockerfile: docker/services/Dockerfile.stt-coordinator
            build_args: ""
          - service: stt-transcription
            variant: cpu
            dockerfile: docker/services/Dockerfile.transcription
            build_args: STT_TRANSCRIPTION_HARDWARE=cpu
          - service: stt-wakeword
            variant: cpu
            dockerfile: docker/services/Dockerfile.wakeword
            build_args: STT_WAKEWORD_HARDWARE=cpu

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: aurora-${{ matrix.service }}:${{ matrix.variant }}-ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.variant }}

  docker-publish:
    name: Publish ${{ matrix.service }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: docker-build
    if: inputs.publish_images == true
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            variant: latest
            dockerfile: docker/services/Dockerfile.auth
            build_args: ""
          - service: config
            variant: latest
            dockerfile: docker/services/Dockerfile.config
            build_args: ""
          - service: db
            variant: openai
            dockerfile: docker/services/Dockerfile.db
            build_args: DB_EMBEDDINGS_MODE=openai
          - service: db
            variant: local-cpu
            dockerfile: docker/services/Dockerfile.db
            build_args: DB_EMBEDDINGS_MODE=local
          - service: gateway
            variant: latest
            dockerfile: docker/services/Dockerfile.gateway
            build_args: ""
          - service: orchestrator
            variant: openai
            dockerfile: docker/services/Dockerfile.orchestrator
            build_args: ORCHESTRATOR_LLM_MODE=openai
          - service: orchestrator
            variant: llama-cpp-cpu
            dockerfile: docker/services/Dockerfile.orchestrator
            build_args: |
              ORCHESTRATOR_LLM_MODE=llama-cpp
              ORCHESTRATOR_HARDWARE=cpu
          - service: scheduler
            variant: latest
            dockerfile: docker/services/Dockerfile.scheduler
            build_args: ""
          - service: tooling
            variant: latest
            dockerfile: docker/services/Dockerfile.tooling
            build_args: ""
          - service: tts
            variant: cpu
            dockerfile: docker/services/Dockerfile.tts
            build_args: TTS_HARDWARE=cpu
          - service: stt-coordinator
            variant: latest
            dockerfile: docker/services/Dockerfile.stt-coordinator
            build_args: ""
          - service: stt-transcription
            variant: cpu
            dockerfile: docker/services/Dockerfile.transcription
            build_args: STT_TRANSCRIPTION_HARDWARE=cpu
          - service: stt-wakeword
            variant: cpu
            dockerfile: docker/services/Dockerfile.wakeword
            build_args: STT_WAKEWORD_HARDWARE=cpu

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate canonical version
        id: meta
        run: |
          version='${{ inputs.release_version }}'
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release_version must be an exact semantic version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/aurora-${{ matrix.service }}:${{ matrix.variant }}-${{ steps.meta.outputs.version }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/aurora-${{ matrix.service }}:${{ matrix.variant }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.variant }}
