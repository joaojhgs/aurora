name: WebRTC live interop

on:
  pull_request:
    paths:
      - "app/services/auth/**"
      - "app/services/config/config_defaults.json"
      - "app/services/gateway/service.py"
      - "app/services/gateway/webrtc/**"
      - "packages/aurora-sdk/src/**"
      - "packages/aurora-ui/src/**"
      - "apps/aurora-web/app/**"
      - "apps/aurora-web/package.json"
      - "apps/aurora-tauri/src/legacy-webview-polyfills.ts"
      - "tests/e2e/webrtc_interop/**"
      - "tests/e2e/hosted_thin_shell/**"
      - "tests/e2e/browser_persistence/**"
      - "packages/aurora-ui/tests/browser-*.playwright.config.ts"
      - "packages/aurora-ui/tests/browser-*.pw.ts"
      - "scripts/run_browser_storage_gate.mjs"
      - "scripts/run_browser_storage_gate.test.mjs"
      - "scripts/hosted_thin_shell_e2e.sh"
      - "scripts/webrtc_interop*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "docker-compose.webrtc-interop.yml"
      - "tests/fixtures/webrtc_interop/**"
      - ".github/workflows/webrtc-interop.yml"
  workflow_dispatch:

jobs:
  live-interop:
    name: Browser persistence and cross-engine network paths
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: uv sync --extra gateway
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run consolidated browser storage E2E gate
        env:
          BROWSER_STORAGE_REPORT_ROOT: reports/browser-storage
        run: pnpm test:web-persistence

      - name: Run the hosted thin-shell UI against the full Python service
        run: pnpm test:web-thin:live

      - name: Run strict direct, STUN, and TURN interoperability matrix
        env:
          WEBRTC_INTEROP_REQUIRE_ALL_BROWSERS: "1"
        run: pnpm test:webrtc:browsers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webrtc-interop-e2e
          path: |
            reports/browser-storage/
            reports/webrtc-interop/
            reports/hosted-thin-shell/
          if-no-files-found: warn
