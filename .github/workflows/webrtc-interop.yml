name: WebRTC live interop

on:
  pull_request:
    paths:
      - "app/services/gateway/webrtc/**"
      - "packages/aurora-sdk/src/mesh.ts"
      - "packages/aurora-sdk/src/webrtc/**"
      - "packages/aurora-ui/src/browser-peer-persistence.ts"
      - "packages/aurora-ui/src/web-thin-runtime.ts"
      - "apps/aurora-web/app/aurora-client.ts"
      - "apps/aurora-tauri/src/legacy-webview-polyfills.ts"
      - "tests/e2e/webrtc_interop/**"
      - "tests/e2e/browser_persistence/**"
      - "scripts/webrtc_interop*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "docker-compose.webrtc-interop.yml"
      - "tests/fixtures/webrtc_interop/**"
      - ".github/workflows/webrtc-interop.yml"
  workflow_dispatch:

jobs:
  live-interop:
    name: Browser persistence and cross-engine network paths
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: uv sync --all-extras
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run encrypted browser persistence E2E tests
        run: pnpm test:web-persistence

      - name: Run strict direct, STUN, and TURN interoperability matrix
        env:
          WEBRTC_INTEROP_REQUIRE_ALL_BROWSERS: "1"
        run: pnpm test:webrtc:browsers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webrtc-interop-e2e
          path: reports/webrtc-interop/
          if-no-files-found: warn
