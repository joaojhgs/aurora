name: Unsigned Cross-Platform Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      prerelease:
        description: "Create prerelease"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Build every package without creating a tag or release"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-release-readiness:
    name: Unsigned release readiness checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.semver.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main for publishing
        if: inputs.dry_run == false
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Unsigned releases may only be published from main" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust for browser voice runtime
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned browser voice toolchain
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126
          fallback: none

      - name: Install Python release dependencies
        run: uv sync --extra dev --extra build

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate release dependency inventory
        run: pnpm --dir apps/aurora-tauri run verify:release-dependency-inventory

      - name: Upload release dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-dependency-inventory
          path: apps/aurora-tauri/reports/release-dependency-inventory.json
          if-no-files-found: error

      - name: Run unsigned release checks
        run: |
          uv run make check-config-generated
          uv run ruff check app tests scripts
          pnpm --filter @aurora/mesh-authority-web build
          pnpm --filter @aurora/client build
          pnpm --filter @aurora/ui build
          pnpm --filter @aurora/tauri-ui verify:static-release-rollback-policy
          pnpm --filter @aurora/tauri-ui prepare:sidecar:desktop-local-minimal
          pnpm --filter @aurora/tauri-ui build

      - name: Upload static release rollback policy report
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-rollback-policy
          path: apps/aurora-tauri/reports/release-rollback-plan-policy.json
          if-no-files-found: error

      - name: Check next semantic version
        id: semver
        run: |
          release_args=(--print --no-commit --no-tag --no-push --no-vcs-release)
          if [ "${{ inputs.release_type }}" != "auto" ]; then
            release_args+=(--${{ inputs.release_type }})
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            release_args+=(--as-prerelease --prerelease-token rc)
          fi
          version=$(uv run semantic-release version "${release_args[@]}")
          if [ -z "$version" ]; then
            echo "semantic-release produced an empty version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Unsigned release candidate version: $version"

  build-desktop-packages:
    name: Build unsigned desktop packages
    needs: unsigned-release-readiness
    uses: ./.github/workflows/tauri-desktop.yml
    with:
      release_version: ${{ needs.unsigned-release-readiness.outputs.version }}

  build-android-packages:
    name: Build unsigned Android packages
    needs: unsigned-release-readiness
    uses: ./.github/workflows/tauri-android.yml
    with:
      release_version: ${{ needs.unsigned-release-readiness.outputs.version }}

  build-ios-package:
    name: Build unsigned iOS simulator package
    needs: unsigned-release-readiness
    uses: ./.github/workflows/tauri-ios.yml
    with:
      release_version: ${{ needs.unsigned-release-readiness.outputs.version }}

  create-release:
    name: Create unsigned semantic release
    runs-on: ubuntu-latest
    needs:
      - unsigned-release-readiness
      - build-desktop-packages
      - build-android-packages
      - build-ios-package
    if: success() && inputs.dry_run == false
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_RELEASE || github.token }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.4.1
        env:
          GH_TOKEN: ${{ secrets.PAT_RELEASE || github.token }}
        with:
          github_token: ${{ secrets.PAT_RELEASE || github.token }}
          git_committer_name: "github-actions[bot]"
          git_committer_email: "github-actions[bot]@users.noreply.github.com"
          verbosity: "2"
          strict: true
          force: ${{ inputs.release_type != 'auto' && inputs.release_type || '' }}
          prerelease: ${{ inputs.prerelease == true }}
          prerelease_token: rc

  publish-release-assets:
    name: Publish unsigned platform artifacts
    runs-on: ubuntu-latest
    needs:
      - unsigned-release-readiness
      - create-release
      - build-desktop-packages
      - build-android-packages
      - build-ios-package
    if: success() && inputs.dry_run == false && needs.create-release.outputs.released == 'true'
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-desktop-client-*
          path: release-artifacts/desktop
          merge-multiple: true

      - name: Download Android packages
        uses: actions/download-artifact@v4
        with:
          pattern: aurora-android-client-debug-*
          path: release-artifacts/android
          merge-multiple: true

      - name: Download iOS simulator package
        uses: actions/download-artifact@v4
        with:
          pattern: aurora-ios-client-simulator
          path: release-artifacts/ios
          merge-multiple: true

      - name: Validate and publish release assets
        env:
          GH_TOKEN: ${{ secrets.PAT_RELEASE || github.token }}
        run: |
          expected_version="${{ needs.unsigned-release-readiness.outputs.version }}"
          if [ "${{ needs.create-release.outputs.version }}" != "$expected_version" ]; then
            echo "Released version does not match the version embedded in platform artifacts" >&2
            exit 1
          fi
          mapfile -t assets < <(
            find release-artifacts -type f \
              \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                 -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
                 -o -name '*.apk' -o -name '*.aab' -o -name '*.zip' \) \
              -print | sort
          )
          if [ "${#assets[@]}" -lt 8 ]; then
            printf 'Expected cross-platform release assets; found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          for extension in AppImage deb dmg msi apk aab zip; do
            if ! printf '%s\n' "${assets[@]}" | grep -Eq "\\.${extension}$"; then
              echo "Missing required .${extension} release asset" >&2
              exit 1
            fi
          done
          if ! printf '%s\n' "${assets[@]}" | grep -Eq -- '-setup\.exe$'; then
            echo "Missing required Windows setup executable" >&2
            exit 1
          fi
          sha256sum "${assets[@]}" > release-artifacts/SHA256SUMS
          printf '%s\n' \
            "Aurora unsigned cross-platform artifacts" \
            "Version: $expected_version" \
            "Source commit: $GITHUB_SHA" \
            "These packages are not code-signed or store-notarized." \
            > release-artifacts/UNSIGNED-ARTIFACTS.txt
          tag="${{ needs.create-release.outputs.tag }}"
          gh release view "$tag" >/dev/null
          gh release upload \
            "$tag" \
            "${assets[@]}" \
            release-artifacts/SHA256SUMS \
            release-artifacts/UNSIGNED-ARTIFACTS.txt \
            --clobber
