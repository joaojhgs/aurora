name: Tauri iOS Policy and Signing

on:
  pull_request:
    paths:
      - "apps/aurora-tauri/**"
      - "packages/aurora-sdk/**"
      - "packages/aurora-ui/**"
      - "packages/aurora-voice-web/**"
      - "rust/crates/aurora-voice-*/**"
      - "tools/voice-runtime/**"
      - "modules/ui-mock-reference/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/tauri-ios-release.yml"
  workflow_dispatch:
    inputs:
      app_store_dry_run:
        description: "Run App Store Connect export/signing dry run. Requires Apple signing secrets."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  ios-policy:
    name: iOS manifest and UI policy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust for browser voice runtime
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned browser voice toolchain
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126
          fallback: none

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @aurora/client build

      - name: Typecheck shared UI
        run: pnpm --filter @aurora/ui typecheck

      - name: Test shared UI
        run: pnpm --filter @aurora/ui test

      - name: Validate iOS preflight policy
        run: pnpm --filter @aurora/tauri-ui ios:policy

  ios-macos-xcode:
    name: macOS Xcode iOS preflight
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    needs: ios-policy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-apple-ios,wasm32-unknown-unknown

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned browser voice toolchain
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126
          fallback: none

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore patched device Sherpa runtime
        if: inputs.app_store_dry_run == 'true'
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: .artifacts/sherpa-onnx/native-runtime-build/runtime/aarch64-apple-ios
          key: sherpa-native-${{ runner.os }}-aarch64-apple-ios-${{ hashFiles('tools/voice-runtime/build_sherpa_native.py', 'tools/voice-runtime/run_sherpa_cmake.py', 'tools/voice-runtime/sherpa-patches/**') }}

      - name: Build patched device Sherpa runtime
        if: inputs.app_store_dry_run == 'true' && steps.sherpa-cache.outputs.cache-hit != 'true'
        run: >-
          python tools/voice-runtime/build_sherpa_native.py
          --target aarch64-apple-ios
          --jobs 2

      - name: Configure patched device Sherpa runtime
        if: inputs.app_store_dry_run == 'true'
        run: |
          echo "AURORA_SHERPA_ONNX_LIB_DIR=$GITHUB_WORKSPACE/.artifacts/sherpa-onnx/native-runtime-build/runtime/aarch64-apple-ios" >> "$GITHUB_ENV"
          echo "AURORA_SHERPA_ONNX_LINK_KIND=static" >> "$GITHUB_ENV"

      - name: Build Tauri workspace dependencies
        run: |
          pnpm --filter @aurora/client build
          pnpm --filter @aurora/ui build
          pnpm --filter @aurora/tauri-ui build

      - name: Verify macOS, Xcode, and generated iOS project
        run: pnpm --filter @aurora/tauri-ui ios:preflight

      - name: Run App Store Connect signing dry run
        if: inputs.app_store_dry_run == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: pnpm --filter @aurora/tauri-ui ios:build:app-store
