name: Python Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest PR commit; non-PR events use a unique run-id fallback.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Unit, integration, and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        run: >-
          uv sync
          --extra dev
          --extra test-unit
          --extra test-integration
          --extra test-e2e
          --extra mode-processes
          --extra gateway
          --extra service-auth
          --extra service-db
          --extra service-scheduler
          --extra service-tooling
          --extra service-orchestrator

      - name: Run unit tests
        run: uv run pytest tests/unit -v --cov=app --cov-report=xml:unit-coverage.xml --cov-report=html:unit-coverage.html

      - name: Run non-process integration tests
        run: >-
          uv run pytest tests/integration -v
          -m "not process_mode and not bullmq_redis"
          --cov=app
          --cov-append
          --cov-report=xml:integration-coverage.xml
          --cov-report=html:integration-coverage.html

      - name: Run process-mode tests
        env:
          AURORA_ARCHITECTURE_MODE: processes
          REDIS_URL: redis://localhost:6379
        run: >-
          uv run pytest tests/integration -v
          -m "process_mode or bullmq_redis"
          --cov=app
          --cov-append
          --cov-report=xml:process-coverage.xml
          --cov-report=html:process-coverage.html

      - name: Generate mesh transport E2E artifacts
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          uv run python scripts/mesh_gap_e2e_harness.py \
            --mode thread_localbus \
            --mode process_bullmq_redis \
            --mode http_gateway_thin_client \
            --mode tauri_local_native \
            --mode mesh_webrtc

      - name: Run all Python E2E tests
        env:
          REDIS_URL: redis://localhost:6379
        run: >-
          uv run pytest tests/e2e -v
          --cov=app
          --cov-append
          --cov-report=xml:e2e-coverage.xml
          --cov-report=html:e2e-coverage.html

      # Runs even when a suite above failed. Previously this step inherited the
      # default success() condition, so a single red suite uploaded nothing and
      # left a hole in the coverage history exactly when it was most useful.
      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./unit-coverage.xml,./integration-coverage.xml,./process-coverage.xml,./e2e-coverage.xml
          flags: python
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload HTML coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-html
          path: |
            unit-coverage.html/
            integration-coverage.html/
            process-coverage.html/
            e2e-coverage.html/

      - name: Upload mesh E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-mesh-transport-e2e
          path: .artifacts/e2e/mesh-transport/latest/
          if-no-files-found: warn
