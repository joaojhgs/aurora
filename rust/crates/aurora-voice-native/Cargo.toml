[package]
name = "aurora-voice-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Aurora voice model store, downloader, transport, and runtime adapters"

[dependencies]
async-trait.workspace = true
aurora-contracts = { path = "../aurora-contracts" }
aurora-voice-core = { path = "../aurora-voice-core" }
aurora-voice-engine = { path = "../aurora-voice-engine" }
aurora-voice-ios-bridge = { path = "../aurora-voice-ios-bridge" }
aurora-voice-sherpa = { path = "../aurora-voice-sherpa", optional = true }
base64.workspace = true
bzip2.workspace = true
crossbeam-queue.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
url.workspace = true

[target.'cfg(any(target_os = "linux", windows, target_os = "macos"))'.dependencies]
cpal.workspace = true

[features]
default = []
native-sherpa = [
    "dep:aurora-voice-sherpa",
    "aurora-voice-sherpa/native-kws",
    "aurora-voice-sherpa/native-stt",
    "aurora-voice-sherpa/native-vad",
]
native-sherpa-tts = [
    "native-sherpa",
    "aurora-voice-sherpa/native-tts",
]
ios-sherpa = [
    "dep:aurora-voice-sherpa",
    "aurora-voice-sherpa/native-kws",
    "aurora-voice-sherpa/native-stt",
    "aurora-voice-sherpa/native-tts",
    "aurora-voice-sherpa/native-vad",
]
desktop-sherpa = ["native-sherpa"]
desktop-sherpa-tts = ["native-sherpa-tts"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
