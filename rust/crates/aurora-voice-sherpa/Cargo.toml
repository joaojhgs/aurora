[package]
name = "aurora-voice-sherpa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sherpa engine adapter boundary reserved for Phase 6 integration"

[dependencies]
async-trait.workspace = true
aurora-voice-core = { path = "../aurora-voice-core" }
aurora-voice-engine = { path = "../aurora-voice-engine" }
aurora-voice-sherpa-sys = { path = "../aurora-voice-sherpa-sys", optional = true }
pinyin = { version = "=0.11.0", optional = true, default-features = false, features = ["with_tone"] }
sentencepiece-rust = { version = "=0.1.1", optional = true, default-features = false }
thiserror.workspace = true

[features]
default = []
kws-pinyin = ["dep:pinyin"]
kws-sentencepiece = ["dep:sentencepiece-rust"]
native-kws = [
    "dep:aurora-voice-sherpa-sys",
    "aurora-voice-sherpa-sys/native-kws",
    "kws-pinyin",
    "kws-sentencepiece",
]
native-stt = ["dep:aurora-voice-sherpa-sys", "aurora-voice-sherpa-sys/native-stt"]
native-tts = ["dep:aurora-voice-sherpa-sys", "aurora-voice-sherpa-sys/native-tts"]
native-vad = ["dep:aurora-voice-sherpa-sys", "aurora-voice-sherpa-sys/native-vad"]

[lints]
workspace = true
