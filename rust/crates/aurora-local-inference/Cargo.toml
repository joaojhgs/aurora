[package]
name = "aurora-local-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Profile-scoped offline chat over Aurora's pinned llama.cpp runtime"

[features]
default = []
native-llamacpp = []
native-needle2 = ["native-llamacpp"]
native-cactus = ["native-llamacpp", "dep:zip", "dep:flate2"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"], optional = true }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"], optional = true }

[build-dependencies]
cc = "1"
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
